<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — RapidSite AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <style>
        body {
            background: var(--bg-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 3rem;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-md);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-logo p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }

        .auth-form .form-group {
            margin-bottom: 1.25rem;
        }

        .auth-btn {
            width: 100%;
            padding: 0.85rem;
            background: var(--accent-primary);
            border: 1px solid var(--accent-primary-hover);
            border-radius: var(--radius-sm);
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .auth-btn:hover {
            background: var(--accent-primary-hover);
            box-shadow: var(--shadow-md);
        }

        .flash-messages {
            margin-bottom: 1.25rem;
        }

        .flash {
            padding: 0.75rem 1rem;
            border-radius: var(--radius-sm);
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
        }

        .flash.error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: var(--accent-danger);
        }

        .flash.success {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: var(--accent-success);
        }
    </style>
</head>

<body>
    <div class="auth-card">
        <div class="auth-logo">
            <img src="{{ url_for('static', filename='images/logo_web.png') }}" alt="RapidSite AI" style="height: 48px; margin-bottom: 0.5rem; display: block; margin-left: auto; margin-right: auto;">
            <p>Create a new password for your account.</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flash-messages">
            {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="form-group">
                <label class="form-label">New Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required minlength="6">
            </div>

            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required minlength="6">
            </div>

            <button type="submit" class="auth-btn">Save New Password</button>
        </form>
    </div>
</body>

</html>
