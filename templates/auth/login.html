<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — RapidSite AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <style>
        body {
            background: var(--bg-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 3rem;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-md);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-logo h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .auth-logo h1 span {
            color: var(--accent-primary);
        }

        .auth-logo p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        .auth-form .form-group {
            margin-bottom: 1.25rem;
        }

        .auth-btn {
            width: 100%;
            padding: 0.85rem;
            background: var(--accent-primary);
            border: 1px solid var(--accent-primary-hover);
            border-radius: var(--radius-sm);
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .auth-btn:hover {
            background: var(--accent-primary-hover);
            box-shadow: var(--shadow-md);
        }

        .auth-divider {
            text-align: center;
            margin: 1.5rem 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .auth-link {
            text-align: center;
        }

        .auth-link a {
            color: var(--accent-secondary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .auth-link a:hover {
            text-decoration: underline;
        }

        .flash-messages {
            margin-bottom: 1.25rem;
        }

        .flash {
            padding: 0.75rem 1rem;
            border-radius: var(--radius-sm);
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
        }

        .flash.error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: var(--accent-danger);
        }

        .flash.success {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: var(--accent-success);
        }

        .flash.warning {
            background: #fff7ed;
            border: 1px solid #fed7aa;
            color: var(--accent-warning);
        }

        .flash.info {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: var(--accent-secondary);
        }
    </style>
</head>

<body>
    <div class="auth-card">
        <div class="auth-logo">
            <h1>🏗️ Field<span>Flow</span> AI</h1>
            <p>Construction Report System</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flash-messages">
            {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" placeholder="your@email.com" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="auth-btn">Sign In</button>
        </form>

        <div class="auth-divider">Don't have an account?</div>

        <div class="auth-link">
            <a href="{{ url_for('auth.register') }}">Register your company →</a>
        </div>
    </div>
</body>

</html>
